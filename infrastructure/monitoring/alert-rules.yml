# =============================================================================
# Prometheus Alert Rules - Trading Platform
# =============================================================================
groups:
  # ---------------------------------------------------------------------------
  # Infrastructure Alerts
  # ---------------------------------------------------------------------------
  - name: infrastructure
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Instance {{ $labels.instance }} is down"
          description: "{{ $labels.job }} instance {{ $labels.instance }} has been unreachable for more than 1 minute."

      - alert: HighCPUUsage
        expr: (100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is above 80% for more than 5 minutes. Current: {{ $value }}%"

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is above 85% for more than 5 minutes. Current: {{ $value }}%"

      - alert: DiskSpaceLow
        expr: (1 - (node_filesystem_avail_bytes{fstype!="tmpfs"} / node_filesystem_size_bytes{fstype!="tmpfs"})) * 100 > 90
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Disk space critically low on {{ $labels.instance }}"
          description: "Disk usage is above 90%. Current: {{ $value }}%"

  # ---------------------------------------------------------------------------
  # Application Alerts
  # ---------------------------------------------------------------------------
  - name: application
    rules:
      - alert: HighErrorRate
        expr: sum(rate(api_requests_total{status_code=~"5.."}[5m])) / clamp_min(sum(rate(api_requests_total[5m])), 1) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "More than 5% of requests are returning 5xx errors. Current: {{ $value | humanizePercentage }}"

      - alert: HighLatencyP95
        expr: histogram_quantile(0.95, sum(rate(api_request_latency_seconds_bucket[5m])) by (le)) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High P95 latency"
          description: "P95 response time is above 2 seconds for the last 10 minutes. Current: {{ $value }}s"

      - alert: HighLatencyP99
        expr: histogram_quantile(0.99, sum(rate(api_request_latency_seconds_bucket[5m])) by (le)) > 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Critical P99 latency"
          description: "P99 response time is above 5 seconds. Current: {{ $value }}s"

      - alert: HighRequestRate
        expr: sum(rate(api_requests_total[1m])) > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Unusually high request rate"
          description: "Request rate exceeds 1000 req/min. Current: {{ $value }} req/s"

      - alert: ReplayFailuresDetected
        expr: increase(replay_failures_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Replay failures detected"
          description: "One or more replay runs failed in the last 5 minutes."

      - alert: RedisLatencyHigh
        expr: histogram_quantile(0.95, sum(rate(redis_roundtrip_seconds_bucket[5m])) by (le)) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis latency is high"
          description: "P95 Redis roundtrip exceeded 50ms. Current: {{ $value }}s"

      - alert: ApiErrorSpike
        expr: sum(rate(api_errors_total[5m])) > 10
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "API error spike"
          description: "api_errors_total exceeded 10/s over the last 5 minutes."

      - alert: OrderRejectionSpike
        expr: increase(orders_rejected_total[5m]) > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Order rejection spike"
          description: "More than 5 orders were rejected in the last 5 minutes."

      - alert: RateLimitViolationsHigh
        expr: increase(rate_limit_violations_total[5m]) > 20
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Rate limit violations elevated"
          description: "Rate-limit violations crossed 20 in the last 5 minutes."

      - alert: ReplayDeterminismFailure
        expr: replay_determinism_status == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Replay determinism failure"
          description: "Replay engine produced non-deterministic results"

      - alert: FinancialInvariantViolation
        expr: financial_invariant_status == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Financial invariant violation"
          description: "Financial invariant violation detected"

  # ---------------------------------------------------------------------------
  # Kubernetes Alerts
  # ---------------------------------------------------------------------------
  - name: kubernetes
    rules:
      - alert: PodCrashLooping
        expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping"
          description: "Pod has restarted {{ $value }} times in the last 15 minutes."

      - alert: PodNotReady
        expr: kube_pod_status_ready{condition="true"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is not ready"
          description: "Pod has been in a non-ready state for more than 5 minutes."

      - alert: HPAMaxedOut
        expr: kube_horizontalpodautoscaler_status_current_replicas == kube_horizontalpodautoscaler_spec_max_replicas
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "HPA {{ $labels.namespace }}/{{ $labels.horizontalpodautoscaler }} is at max replicas"
          description: "The HPA has been running at maximum replica count for 15+ minutes."

  # ---------------------------------------------------------------------------
  # Database Alerts
  # ---------------------------------------------------------------------------
  - name: database
    rules:
      - alert: PostgreSQLDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL instance {{ $labels.instance }} is unreachable."

      - alert: PostgreSQLHighConnections
        expr: pg_stat_activity_count / pg_settings_max_connections > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connections running high"
          description: "Connection usage is above 80%. Current: {{ $value | humanizePercentage }}"

      - alert: PostgreSQLSlowQueries
        expr: rate(pg_stat_activity_max_tx_duration{datname!~"template.*"}[5m]) > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL has slow queries"
          description: "Queries running longer than 5 minutes detected."
