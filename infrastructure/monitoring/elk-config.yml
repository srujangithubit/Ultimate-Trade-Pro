# =============================================================================
# ELK Stack - Filebeat Configuration
# =============================================================================
# Collects structured logs from the trading platform and ships to Elasticsearch

filebeat.inputs:
  # Application logs (NestJS JSON format)
  - type: container
    enabled: true
    paths:
      - /var/log/containers/trading-platform-api-*.log
    processors:
      - decode_json_fields:
          fields: ["message"]
          target: "app"
          overwrite_keys: true
          add_error_key: true
      - add_kubernetes_metadata:
          host: ${NODE_NAME}
          matchers:
            - logs_path:
                logs_path: "/var/log/containers/"
    fields:
      service: trading-platform-api
      environment: production
    fields_under_root: true

  # Audit logs
  - type: log
    enabled: true
    paths:
      - /var/log/trading-platform/audit-*.log
    json:
      keys_under_root: true
      overwrite_keys: true
    fields:
      log_type: audit
    fields_under_root: true

# Processors (global)
processors:
  - add_host_metadata:
      when.not.contains.tags: forwarded
  - add_cloud_metadata: ~
  - drop_fields:
      fields: ["agent.ephemeral_id", "agent.hostname", "agent.id", "agent.version", "ecs.version"]

# Output to Elasticsearch
output.elasticsearch:
  hosts: ["${ELASTICSEARCH_HOST:elasticsearch:9200}"]
  index: "trading-platform-%{+yyyy.MM.dd}"
  username: "${ELASTICSEARCH_USERNAME:elastic}"
  password: "${ELASTICSEARCH_PASSWORD:changeme}"

  # Index lifecycle management
  ilm.enabled: true
  ilm.rollover_alias: "trading-platform"
  ilm.pattern: "{now/d}-000001"
  ilm.policy: |
    {
      "policy": {
        "phases": {
          "hot": {
            "actions": {
              "rollover": {
                "max_age": "7d",
                "max_size": "10gb"
              }
            }
          },
          "warm": {
            "min_age": "7d",
            "actions": {
              "readonly": {}
            }
          },
          "delete": {
            "min_age": "30d",
            "actions": {
              "delete": {}
            }
          }
        }
      }
    }

# Kibana (for dashboard setup)
setup.kibana:
  host: "${KIBANA_HOST:kibana:5601}"

# Logging
logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
  permissions: 0644
