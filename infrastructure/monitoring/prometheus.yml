# =============================================================================
# Prometheus Configuration - Trading Platform
# =============================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Alert rules
rule_files:
  - "/etc/prometheus/alert-rules.yml"

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Trading Platform API
  - job_name: "trading-platform-api"
    metrics_path: /metrics
    scrape_interval: 10s

    # For Docker Compose (local dev)
    static_configs:
      - targets: ["api:3000"]
        labels:
          environment: "development"

    # For Kubernetes (production)
    # Uncomment below and comment out static_configs for K8s
    # kubernetes_sd_configs:
    #   - role: pod
    # relabel_configs:
    #   - source_labels: [__meta_kubernetes_pod_label_app]
    #     action: keep
    #     regex: trading-platform-api
    #   - source_labels: [__meta_kubernetes_namespace]
    #     target_label: namespace
    #   - source_labels: [__meta_kubernetes_pod_name]
    #     target_label: pod
    #   - source_labels: [__meta_kubernetes_pod_node_name]
    #     target_label: node

  # Node Exporter (system metrics)
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  # PostgreSQL Exporter
  - job_name: "postgres-exporter"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Redis Exporter
  - job_name: "redis-exporter"
    static_configs:
      - targets: ["redis-exporter:9121"]

  # Tempo metrics endpoint
  - job_name: "tempo"
    static_configs:
      - targets: ["tempo:3200"]
